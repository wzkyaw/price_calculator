<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, "Noto Sans Myanmar", sans-serif;
    background: #f4f6f9;
    color: #172033;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 6px;
}

.subtitle {
    text-align: center;
    color: #667085;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    height: 55px;
    padding: 0 15px;
    border: 2px solid #d9dee8;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #f1f3f6;
    padding: 12px 5px;
    font-size: 13px;
}

td {
    padding: 14px 5px;
    text-align: center;
    border-bottom: 1px solid #e5e7eb;
    font-size: 14px;
}

.price {
    font-weight: bold;
    font-size: 16px;
}

.profit {
    font-weight: bold;
}

.percent {
    font-weight: bold;
}

.info {
    margin-top: 15px;
    padding: 14px;
    background: #f8fafc;
    border-radius: 10px;
    line-height: 1.8;
    font-size: 13px;
}

.empty {
    text-align: center;
    color: #98a2b3;
    padding: 25px;
}

@media (max-width: 500px) {
    body {
        padding: 12px;
    }

    .card {
        padding: 13px;
    }

    th,
    td {
        font-size: 11px;
        padding: 11px 3px;
    }

    .price {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h3>Price Calculator</h3>


    <div class="card">

        <label>100 လုံး မူလ Cost (ကျပ်)</label>

        <input
            type="number"
            id="cost"
            placeholder="ဥပမာ 38000"
            min="0"
            inputmode="numeric"
        >

    </div>


    <div class="card">

        <div id="result">

            <div class="empty">
                100 လုံး Cost ထည့်ပါ
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   100 လုံး Cost အလိုက် Base Markup
   ===================================================== */

function getBaseMarkup(cost) {

    if (cost <= 3000) {
        return 35;
    }

    if (cost <= 5000) {
        return 32;
    }

    if (cost <= 10000) {
        return 28;
    }

    if (cost <= 20000) {
        return 25;
    }

    if (cost <= 30000) {
        return 23;
    }

    if (cost <= 50000) {
        return 20;
    }

    if (cost <= 100000) {
        return 18;
    }

    return 15;
}


/* =====================================================
   Quantity အလိုက် Markup
   =====================================================

   100 လုံး = Base %
   50 လုံး  = Base + 2%
   10 လုံး  = Base + 10%
   1 လုံး   = Base + 15%
*/

function getMarkup(quantity, baseMarkup) {

    if (quantity === 100)
        return baseMarkup;

    if (quantity === 50)
        return baseMarkup + 2;

    if (quantity === 10)
        return baseMarkup + 10;

    if (quantity === 1)
        return baseMarkup + 15;
}


/* =====================================================
   ငွေပေးချေရလွယ်အောင် Round Up
   ===================================================== */

function roundPrice(price) {

    let step;

    if (price < 1000) {
        step = 50;
    }
    else if (price < 5000) {
        step = 100;
    }
    else if (price < 10000) {
        step = 200;
    }
    else if (price < 50000) {
        step = 500;
    }
    else if (price < 100000) {
        step = 1000;
    }
    else if (price < 500000) {
        step = 5000;
    }
    else {
        step = 10000;
    }

    return Math.ceil(price / step) * step;
}


/* =====================================================
   Money Format
   ===================================================== */

function money(number) {

    return new Intl.NumberFormat("en-US")
        .format(Math.round(number)) + " ကျပ်";

}


/* =====================================================
   Calculate
   ===================================================== */

function calculate() {

    const cost100 =
        Number(document.getElementById("cost").value);

    const result =
        document.getElementById("result");


    if (!cost100 || cost100 <= 0) {

        result.innerHTML = `
            <div class="empty">
                100 လုံး Cost ထည့်ပါ
            </div>
        `;

        return;
    }


    const baseMarkup =
        getBaseMarkup(cost100);


    const quantities = [
        100,
        50,
        10,
        1
    ];


    let html = `

        <table>

            <thead>

                <tr>
                    <th>အရေအတွက်</th>
                    <th>ရောင်းဈေး</th>
                    <th>အမြတ်</th>
                    <th>အမြတ် %</th>
                </tr>

            </thead>

            <tbody>
    `;


    quantities.forEach(quantity => {

        /* Quantity အလိုက် Cost */

        const cost =
            cost100 / 100 * quantity;


        /* Quantity အလိုက် Markup */

        const markup =
            getMarkup(quantity, baseMarkup);


        /* Formula ဖြင့် ရောင်းဈေး */

        const calculatedPrice =
            cost * (1 + markup / 100);


        /* Round Up */

        const sellingPrice =
            roundPrice(calculatedPrice);


        /* အမြတ် */

        const profit =
            sellingPrice - cost;


        /* တကယ်ရတဲ့ အမြတ် % */

        const actualProfitPercent =
            (profit / cost) * 100;


        html += `

            <tr>

                <td>
                    <strong>
                        ${quantity} လုံး
                    </strong>
                </td>

                <td class="price">
                    ${money(sellingPrice)}
                </td>

                <td class="profit">
                    ${money(profit)}
                </td>

                <td class="percent">
                    ${actualProfitPercent.toFixed(2)}%
                </td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>


        <div class="info">

            <b>100 လုံး Cost:</b>
            ${money(cost100)}

            <br>

            <b>Base Markup:</b>
            ${baseMarkup}%

            <br><br>

            <b>တွက်ပုံ:</b>

            <br>

            ရောင်းဈေး =
            Cost × (1 + Markup ÷ 100)

            <br>

            <small>
                အမြတ် % သည် ဈေး Round Up ပြီးနောက်
                တကယ်ရရှိသော အမြတ်ရာခိုင်နှုန်း ဖြစ်သည်။
            </small>

        </div>

    `;


    result.innerHTML = html;
}


/* =====================================================
   Live Calculation
   ===================================================== */

document
    .getElementById("cost")
    .addEventListener("input", calculate);

</script>

</body>
</html>
